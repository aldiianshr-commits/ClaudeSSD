# Membangun APK CloudSSD di server GitHub (tanpa laptop).
# Berjalan otomatis setiap ada perubahan di branch main, atau manual lewat tab Actions › "Build APK" › Run workflow.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # untuk membuat rilis "latest" berisi file APK

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Siapkan kunci tanda tangan tetap (opsional)
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/cloudssd.jks"
            echo "CLOUDSSD_KEYSTORE=$RUNNER_TEMP/cloudssd.jks" >> "$GITHUB_ENV"
            echo "CLOUDSSD_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_NOTE=Ditandatangani dengan kunci tetap: pembaruan dapat dipasang langsung di atas versi lama." >> "$GITHUB_ENV"
          else
            echo "SIGNING_NOTE=PERHATIAN: ditandatangani dengan kunci debug acak. Untuk memperbarui, hapus dulu aplikasi lama (akun admin & pilihan folder SSD perlu diatur ulang; file di SSD tidak terhapus)." >> "$GITHUB_ENV"
          fi

      - name: Tes modul inti
        run: |
          chmod +x gradlew
          ./gradlew :core:test --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudSSD-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Terbitkan ke rilis "latest" (unduh langsung dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CloudSSD.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest CloudSSD.apk \
            --title "CloudSSD (build terbaru)" \
            --notes "APK dibangun otomatis dari commit ${GITHUB_SHA::7}. Pasang di Xiaomi Pad 6 (Android 11+). ${SIGNING_NOTE}"
